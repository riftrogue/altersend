name: Flatpak Publish

on:
  push:
    # TODO: revert before upstream PR
    # branches:
    #   - main
    paths:
      - 'flatpak/**'
      - '.github/workflows/flatpak-publish.yml'
  workflow_dispatch:

concurrency:
  group: "flatpak-publish"
  cancel-in-progress: true

jobs:
  build-flatpak:
    # TODO: revert before upstream PR
    # if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions@sha256:d534700a8a0090dfa5e23ed3ae09106a1beafde54e66b6b1327b27dbd3f0c7c2 # freedesktop-24.08
      # --privileged is required by flatpak-builder to create user namespace
      # sandboxes for the offline build. This is the standard configuration
      # for all flatpak CI pipelines.
      options: --privileged
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install AWS CLI
        shell: bash
        run: |
          curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o awscliv2.zip
          curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip.sig" -o awscliv2.zip.sig

          # Verify the installer against Amazon's official GPG signing key before
          # executing anything. Key fingerprint published at:
          # https://docs.aws.amazon.com/cli/latest/userguide/getting-started-install.html
          # Note: keys.openpgp.org strips user IDs by default causing gpg to skip
          # the import; keyserver.ubuntu.com returns the full key correctly.
          gpg --keyserver hkps://keyserver.ubuntu.com \
              --recv-keys FB5DB77FD5C118B80511ADA8A6310ACC4672475C
          gpg --verify awscliv2.zip.sig awscliv2.zip

          unzip -q awscliv2.zip
          ./aws/install --bin-dir /usr/local/bin --install-dir /usr/local/aws-cli --update
          rm -rf awscliv2.zip awscliv2.zip.sig aws/

      - name: Download existing OSTree repo from R2 for delta updates
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          # OSTree repos contain thousands of small files. Increase concurrency
          # from the default 10 to avoid bottlenecking on per-request latency.
          aws configure set default.s3.max_concurrent_requests 100
          aws configure set default.s3.max_queue_size 10000

          mkdir -p repo
          aws s3 sync s3://altersend-flatpak/ repo/ \
            --endpoint-url "$R2_ENDPOINT" \
            --no-progress \
            || echo "No existing repo found in R2 — will initialize from scratch."

      - name: Clean and verify OSTree repo
        shell: bash
        run: |
          if [ -f repo/config ]; then
            echo "Validating existing OSTree repository..."
            mkdir -p repo/refs/remotes repo/refs/mirrors repo/objects
            ostree fsck --repo=repo || { echo "OSTree fsck failed — repo is corrupt. Reinitializing from scratch."; rm -rf repo; }
          else
            echo "Repository exists but is not an OSTree repository (yet). Cleaning up so flatpak-builder can initialize it."
            rm -rf repo && echo "Cleaned up non-OSTree directory."
          fi

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@111c56156bcc6918c056dbef52164cfa583dc549 # v6
        with:
          gpg_private_key: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          # Uncomment and add secret if your key has a passphrase:
          # passphrase: ${{ secrets.FLATPAK_GPG_PASSPHRASE }}

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@401fe28a8384095fc1531b9d320b292f0ee45adb # v6
        with:
          bundle: altersend.flatpak
          manifest-path: flatpak/com.altersend.AlterSend.yaml
          cache-key: flatpak-builder-${{ hashFiles('flatpak/com.altersend.AlterSend.yaml', 'flatpak/node-modules.json') }}
          build-bundle: false  # Bundle output is handled by a dedicated release workflow
          repository-name: flathub
          repository-url: https://flathub.org/repo/flathub.flatpakrepo
          gpg-sign: ${{ steps.import_gpg.outputs.fingerprint }}

      - name: Sign OSTree Repository & Generate .flatpakrepo
        # Use an env var for the fingerprint instead of direct template injection
        # into the shell script, following GitHub's security hardening guidelines.
        shell: bash
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
        run: |
          flatpak build-update-repo --generate-static-deltas --gpg-sign="$GPG_FINGERPRINT" repo
          gpg --armor --export "$GPG_FINGERPRINT" > repo/altersend.gpg
          GPG_B64=$(gpg --export "$GPG_FINGERPRINT" | base64 | tr -d '\n')

          {
            echo '[Flatpak Repo]'
            echo 'Title=AlterSend'
            echo 'Url=https://pub-af60b48af6474b4190c802bd0534f451.r2.dev/'
            echo 'Homepage=https://altersend.com/'
            echo 'Comment=AlterSend Official Flatpak Repository'
            echo 'Description=Peer-to-peer file transfer'
            echo 'Icon=https://raw.githubusercontent.com/denislupookov/altersend/main/assets/01-logo-icon-logo-icon-512x512.png'
            echo "GPGKey=${GPG_B64}"
          } > repo/altersend.flatpakrepo

      - name: Upload to Cloudflare R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          # Guard: verify the repo is structurally valid before syncing.
          # --delete is safe here because:
          #   1. This step only runs after a fully successful build + sign.
          #   2. If the sync is interrupted, the next run will re-sync and restore consistency.
          ostree fsck --repo=repo

          # OSTree repos contain thousands of small files. Increase concurrency
          # from the default 10 to avoid bottlenecking on per-request latency.
          aws configure set default.s3.max_concurrent_requests 100
          aws configure set default.s3.max_queue_size 10000

          aws s3 sync repo/ s3://altersend-flatpak/ \
            --endpoint-url "$R2_ENDPOINT" \
            --no-progress \
            --delete
