name: Flatpak Publish

on:
  push:
    # TODO: revert before upstream PR
    # branches:
    #   - main
    paths:
      - 'flatpak/**'
      - '.github/workflows/flatpak-publish.yml'
  workflow_dispatch:

concurrency:
  group: "flatpak-publish"
  cancel-in-progress: true

jobs:
  build-flatpak:
    # TODO: revert before upstream PR
    # if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        variant:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
      fail-fast: false
    runs-on: ${{ matrix.variant.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@401fe28a8384095fc1531b9d320b292f0ee45adb # v6
        with:
          manifest-path: flatpak/com.altersend.AlterSend.yaml
          cache-key: flatpak-builder-${{ matrix.variant.arch }}-${{ hashFiles('flatpak/com.altersend.AlterSend.yaml', 'flatpak/node-modules.json') }}
          arch: ${{ matrix.variant.arch }}
          build-bundle: true
          bundle: altersend-${{ matrix.variant.arch }}.flatpak
          repository-name: flathub
          repository-url: https://flathub.org/repo/flathub.flatpakrepo

  publish-flatpak:
    needs: build-flatpak
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Install AWS CLI
        shell: bash
        run: |
          # Pin a specific version and verify its SHA256 before executing anything.
          # To update: download the new version, compute sha256sum, and update both values.
          # Release notes: https://raw.githubusercontent.com/aws/aws-cli/v2/CHANGELOG.rst
          AWS_CLI_VERSION="2.36.14"
          AWS_CLI_SHA256="43b34875482244039716cc3725d1f60e7d47ef3cfb2a19e114759a46db24dc30"

          curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64-${AWS_CLI_VERSION}.zip" \
            -o awscliv2.zip
          echo "${AWS_CLI_SHA256}  awscliv2.zip" | sha256sum --check

          unzip -q awscliv2.zip
          ./aws/install --bin-dir /usr/local/bin --install-dir /usr/local/aws-cli --update
          rm -rf awscliv2.zip aws/

      - name: Configure AWS CLI
        shell: bash
        run: |
          # OSTree repos contain thousands of small files. Increase concurrency
          # from the default 10 to avoid bottlenecking on per-request latency.
          # These settings persist for the lifetime of the container (all subsequent steps).
          aws configure set default.s3.max_concurrent_requests 100
          aws configure set default.s3.max_queue_size 10000

      - name: Download existing OSTree repo from R2 for delta updates
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          mkdir -p repo

          # Sync the existing repo from R2. An empty bucket exits 0 and downloads
          # nothing — no special handling needed. Only suppress NoSuchBucket (true
          # first-run); re-raise all other errors (auth failures, network errors, etc.)
          # to prevent silently deploying over a corrupted or empty state.
          sync_err=$(aws s3 sync s3://altersend-flatpak/ repo/ \
            --endpoint-url "$R2_ENDPOINT" \
            --no-progress 2>&1) || {
            if echo "$sync_err" | grep -q "NoSuchBucket"; then
              echo "Bucket not found — initializing fresh repository."
            else
              echo "$sync_err" >&2
              exit 1
            fi
          }

      - name: Clean and verify OSTree repo
        shell: bash
        run: |
          if [ -f repo/config ]; then
            echo "Validating existing OSTree repository..."
            mkdir -p repo/refs/remotes repo/refs/mirrors repo/objects
            ostree fsck --repo=repo || { echo "OSTree fsck failed — repo is corrupt. Reinitializing from scratch."; rm -rf repo; }
          else
            echo "Repository exists but is not an OSTree repository (yet). Cleaning up so flatpak-builder can initialize it."
            rm -rf repo && echo "Cleaned up non-OSTree directory."
          fi
          
          # Initialize OSTree repo if it doesn't exist
          if [ ! -f repo/config ]; then
            ostree init --mode=archive-z2 --repo=repo
          fi

      - name: Download x86_64 bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: altersend-x86_64-x86_64.flatpak
          path: .

      - name: Download aarch64 bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: altersend-aarch64-aarch64.flatpak
          path: .

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@111c56156bcc6918c056dbef52164cfa583dc549 # v6
        with:
          gpg_private_key: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          # Uncomment and add secret if your key has a passphrase:
          # passphrase: ${{ secrets.FLATPAK_GPG_PASSPHRASE }}

      - name: Import bundles into OSTree repo
        shell: bash
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
        run: |
          flatpak build-import-bundle --gpg-sign="$GPG_FINGERPRINT" repo altersend-x86_64.flatpak
          flatpak build-import-bundle --gpg-sign="$GPG_FINGERPRINT" repo altersend-aarch64.flatpak
          
          # Force sign the entire application and extensions to ensure old commits 
          # (like Locale) from previous runs are signed with the current GPG key.
          flatpak build-sign --gpg-sign="$GPG_FINGERPRINT" repo com.altersend.AlterSend || true
          flatpak build-sign --gpg-sign="$GPG_FINGERPRINT" repo com.altersend.AlterSend.Locale || true
          flatpak build-sign --gpg-sign="$GPG_FINGERPRINT" repo com.altersend.AlterSend.Debug || true
      - name: Sign OSTree Repository & Generate .flatpakrepo
        # Use an env var for the fingerprint instead of direct template injection
        # into the shell script, following GitHub's security hardening guidelines.
        shell: bash
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
        run: |
          flatpak build-update-repo --generate-static-deltas --gpg-sign="$GPG_FINGERPRINT" repo
          gpg --armor --export "$GPG_FINGERPRINT" > repo/altersend.gpg
          GPG_B64=$(gpg --export "$GPG_FINGERPRINT" | base64 | tr -d '\n')

          {
            echo '[Flatpak Repo]'
            echo 'Title=AlterSend'
            echo 'Url=https://pub-af60b48af6474b4190c802bd0534f451.r2.dev/'
            echo 'Homepage=https://altersend.com/'
            echo 'Comment=AlterSend Official Flatpak Repository'
            echo 'Description=Peer-to-peer file transfer'
            echo 'Icon=https://raw.githubusercontent.com/denislupookov/altersend/main/assets/01-logo-icon-logo-icon-512x512.png'
            echo "GPGKey=${GPG_B64}"
          } > repo/altersend.flatpakrepo

      - name: Upload to Cloudflare R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          # Guard: verify the repo is structurally valid before syncing.
          # --delete is safe here because:
          #   1. This step only runs after a fully successful build + sign.
          #   2. If the sync is interrupted, the next run will re-sync and restore consistency.
          ostree fsck --repo=repo

          aws s3 sync repo/ s3://altersend-flatpak/ \
            --endpoint-url "$R2_ENDPOINT" \
            --no-progress \
            --delete
